[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-climate-stance-slm"
version = "0.1.0"
description = "Efficient multilingual small language model for Hindi-Bengali climate stance detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "indic-climate-stance-slm contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "transformers>=4.40", "datasets>=2.19", "peft>=0.10", "accelerate>=0.30"]
explain = ["captum>=0.7", "shap>=0.45"]
demo = ["streamlit>=1.33"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.ruff]
line-length = 110
select = ["E", "F", "I", "UP", "B"]
